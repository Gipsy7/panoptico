<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assinatura de e-mail do Panóptico</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
<!--
  Assinatura de e-mail do Panóptico. Abra este arquivo no navegador, selecione a tabela abaixo
  (do sol até o e-mail), copie e cole no campo de assinatura do webmail.
  A imagem vem de https://panoptico.social.br/assinatura/ (frontend/public/assinatura/): só
  aparece depois que essa pasta estiver publicada. O Outlook do Windows mostra o primeiro quadro
  do GIF, que é a marca completa.
-->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td style="padding:0 14px 0 0;vertical-align:middle;">
      <a href="https://panoptico.social.br" style="text-decoration:none;">
        <img src="https://panoptico.social.br/assinatura/panoptico-assinatura.gif" width="72" height="72" alt="Sol do Panóptico" style="display:block;border:0;width:72px;height:72px;">
      </a>
    </td>
    <td style="padding:2px 0 2px 14px;vertical-align:middle;border-left:2px solid #c9954a;">
      <div style="font-size:16px;line-height:20px;color:#141414;font-weight:bold;">Equipe Panóptico</div>
      <div style="font-size:14px;line-height:20px;color:#7a5a32;font-style:italic;">Quem te representa, às claras</div>
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;padding-top:4px;">
        <a href="https://panoptico.social.br" style="color:#7a5a32;text-decoration:none;font-weight:bold;">panoptico.social.br</a>
        <span style="color:#b8b0a2;">&nbsp;|&nbsp;</span>
        <a href="mailto:contato@panoptico.social.br" style="color:#6a665f;text-decoration:none;">contato@panoptico.social.br</a>
      </div>
    </td>
  </tr>
</table>
</body>
</html>
