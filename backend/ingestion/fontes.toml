modulo = "ingestion.senado.votacoes_comissoes"
uso = "Votos nas comissões do Senado"
recorte = "ano anterior e atual"
frequencia = "diaria"
anos = "padrao"
depende = ["senado_senadores"]

[[fonte]]
nome = "camara_proposicoes"
modulo = "ingestion.camara.proposicoes"
uso = "Projetos de lei do deputado"
