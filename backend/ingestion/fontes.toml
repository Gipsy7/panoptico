depende = ["tse_candidaturas", "camara_deputados", "senado_senadores", "sapl_camaras", "sapl_assembleias", "almg", "alesp"]

# Justiça e controle
[[fonte]]
nome = "tse_cassacoes"
modulo = "ingestion.tse.cassacoes"
uso = "Linha do tempo: cassação e julgamento de candidatura (com número do processo)"
recorte = "só candidaturas de eleitos e parlamentares já ligadas a uma pessoa"
frequencia = "mensal"
anos = [2018, 2020, 2022, 2024]
depende = ["pessoas"]

[[fonte]]
nome = "cgu_sancoes"
modulo = "ingestion.transparencia.sancoes"
uso = "Linha do tempo: sanções a pessoas públicas (improbidade, inidoneidade, expulsão do serviço público)"
