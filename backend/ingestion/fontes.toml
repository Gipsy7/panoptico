# SIGPub (Vox Tecnologia): uma edição PDF com texto por dia e instância (AMM-MG, AMUPE, FAMUP,
# FEMURN, APRECE, AMP, FAMURS...), com dezenas ou centenas de prefeituras. robots.txt aberto;
# calendário público (POST com token CSRF da página) e PDF; a busca avançada tem reCAPTCHA e
# não é usada. Lógica do calendário do raspador do Querido Diário (MIT). Bruto: texto de cada
# edição em data/raw/sigpub_atos/<instância>/ (--de-raw reprocessa sem rede). Roda só no acervo
# (PyMuPDF, do grupo acervo, e volume); sem agenda na VPS (deploy/vps/agenda/). Para agendar:
# pymupdf na imagem e um passo em camaras.sh.

