# O CKAN do Tesouro derruba conexões vindas do GitHub (EUA); na produção roda no runner do Brasil.
# Sem argumento: ano anterior e atual (CKAN do Tesouro; ~140 MB de CSV, bruto = recorte de ~6 MB).
# Carga inicial: `--ano 2019 ... 2026`. Valores líquidos da retenção de 20% do Fundeb.

