# Registro das fontes do acervo local (python -m ingestion.acervo).
#
# Cada [[fonte]]:
#   nome        o mesmo FONTE do módulo (é como aparece em fonte_ingestao)
#   modulo      módulo com a função executar()
#   frequencia  "diaria" | "semanal" | "mensal" | "manual" (manual: só com --fonte)
#   anos        executar(ano) para cada ano: "padrao" (ano anterior e atual),
#               "dois_anteriores", "desde_2023" ou uma lista; sem anos, executar()
#   args        argumentos fixos de executar()
#   depende     fontes que precisam rodar antes (na mesma execução)
#   acesso      degrau de acesso (ver docs/DECISOES.md): "aberto" | "brasil" | "lento"
#               | "espelho" | "pedido" | "lai" | "indisponivel"
#
# Coleta mínima (docs/DECISOES.md): uma fonte só é coletada com uso declarado.
#   situacao    "ativa" (padrão) | "catalogada" (conhecida, sem coleta até ter uso)
#   uso         a pergunta do cidadão ou a seção do site que a fonte alimenta (obrigatório
#               quando ativa)
#   recorte     quais pessoas, órgãos e período são guardados
#   guarda      "linhas" (padrão) | "somas" (só totais, como no site)
#   bruto       "completo" (padrão) | "recorte" (arquivo grande lido em fluxo; fica o
#               recorte em Parquet e o manifesto, e o original é baixado de novo se preciso)

# Federais (as mesmas do run_all, na mesma ordem de dependência)
[[fonte]]
nome = "camara_deputados"
modulo = "ingestion.camara.deputados"
uso = "Perfil do deputado federal"
frequencia = "diaria"

[[fonte]]
nome = "senado_senadores"
modulo = "ingestion.senado.senadores"
uso = "Perfil do senador"
frequencia = "diaria"

[[fonte]]
nome = "camara_despesas"
modulo = "ingestion.camara.despesas"
uso = "Gastos do gabinete do deputado"
recorte = "ano anterior e atual"
frequencia = "diaria"
anos = "padrao"
depende = ["camara_deputados"]

[[fonte]]
nome = "senado_despesas"
modulo = "ingestion.senado.despesas"
uso = "Gastos do gabinete do senador"
recorte = "ano anterior e atual"
frequencia = "diaria"
anos = "padrao"
depende = ["senado_senadores"]

[[fonte]]
nome = "camara_votacoes"
modulo = "ingestion.camara.votacoes"
