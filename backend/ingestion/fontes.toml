# Dados abertos da Imprensa Nacional (in.gov.br/acesso-a-informacao/dados-abertos/base-de-dados):
# um ZIP por mês e seção (S02MMAAAA.zip, ~16 MB, ~16 mil XML), sem cadastro, publicado na
# primeira terça-feira do mês seguinte. O link do ZIP é lido da página da base (traz um id que
# muda). O INLABS (diário do dia em XML) exige cadastro e senha e NÃO é usado. Carga mensal
# incremental (download_cache por mês: mês igual não rebaixa). O ZIP é lido em fluxo e vira
# manifesto; fica só o recorte. dou_ato nasce com revisado = false.

