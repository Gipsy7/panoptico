frequencia = "diaria"
guarda = "somas"
bruto = "recorte"
depende = ["cgu_sancoes", "cnpj_socios"]
# Janela e cursor em pncp_dia: a primeira carga vai de 2023 a hoje (~6 milhões de contratos,
# ~1 dia de coleta contínua); as seguintes relêem os últimos 7 dias e os dias antigos com
# aditivo. Cargas parciais: python -m ingestion.pncp.contratos --de AAAA-MM-DD --ate AAAA-MM-DD.
# Do bruto fica só o manifesto por execução (total da API, páginas, bytes, sha256 por dia).

