# O site diariomunicipal.sc.gov.br veda rastreadores no robots.txt (User-agent: * / Disallow: /)
# e NÃO é rastreado. Os dados abertos do próprio consórcio (dados.ciga.sc.gov.br, CKAN,
# conjuntos mensais domsc-publicacoes-de-MM-AAAA com ZIPs de JSON por dia e faixa de horário)
# são o canal de reúso: só as páginas de conjunto e de download (/api/ é vedado e não é usado),
# 1 requisição a cada 10 s (Crawl-Delay). Bruto: o recorte por lote em data/raw/domsc_ciga_atos/.
# Roda só no acervo; sem agenda na VPS (deploy/vps/agenda/).

