<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão do Panóptico</title>
<style>
:root{--fundo:#f6f5f2;--cartao:#fff;--texto:#1f1d1a;--suave:#6b665e;--borda:#ddd8cf;
--destaque:#5b4a8b;--sim:#2f6b4f;--nao:#8a3b2e}
@media (prefers-color-scheme:dark){:root{--fundo:#1a1917;--cartao:#24221f;--texto:#ece8e1;
--suave:#a39d93;--borda:#3a3732;--destaque:#a99be0;--sim:#7fc4a2;--nao:#e3a092}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);
font:16px/1.5 system-ui,sans-serif}main{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0 auto 0 0}input,textarea{font:inherit;padding:6px 8px;
border:1px solid var(--borda);border-radius:6px;background:var(--cartao);color:var(--texto)}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--borda);border-radius:6px;
padding:8px 14px;background:var(--cartao);color:var(--texto)}
.abas button[aria-pressed=true]{border-color:var(--destaque);color:var(--destaque);font-weight:600}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:18px}
.rotulo{color:var(--suave);font-size:13px;margin-top:10px}.valor{font-size:17px}
.trecho{white-space:pre-wrap;background:var(--fundo);padding:10px;border-radius:6px;
max-height:260px;overflow:auto}mark{background:#f3dd8a;color:#000;padding:0 2px}
.pergunta{font-weight:600;margin:16px 0 8px}.acoes{display:flex;flex-wrap:wrap;gap:8px}
.sim{border-color:var(--sim);color:var(--sim);font-weight:600}
.nao{border-color:var(--nao);color:var(--nao);font-weight:600}
.cand{display:block;width:100%;text-align:left;margin-bottom:6px}
.cand small{color:var(--suave)}kbd{font-size:12px;border:1px solid var(--borda);
border-radius:4px;padding:0 4px;margin-right:4px}a{color:var(--destaque)}
#progresso{color:var(--suave);margin-bottom:8px}#aviso{color:var(--nao);min-height:1.5em}
textarea{width:100%;margin-top:8px}
.lados{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.lado{border:1px solid var(--borda);border-radius:8px;padding:10px}
.lado img,.semfoto{display:block;width:120px;height:160px;object-fit:cover;border-radius:6px;margin:6px 0}
.semfoto{background:var(--fundo);color:var(--suave);font-size:13px;display:flex;align-items:center;
justify-content:center;text-align:center;padding:6px}.sinal{color:var(--suave);margin:10px 0 0}
@media (max-width:560px){.lados{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>Revisão do Panóptico</h1>
<label>Seu nome: <input id="revisor" size="14"></label>
<button id="desfazer" title="Atalho: U">Desfazer última</button></header>
<div class="abas" id="abas"></div>
<div id="progresso"></div><div id="aviso"></div>
<div id="area"></div>
</main><script>
const $=s=>document.querySelector(s);let tipo="vinculo",itens=[],total=0,pos=0,ocupado=false;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{$("#revisor").value=localStorage.getItem("revisor")||""}catch(e){}
$("#revisor").onchange=()=>{try{localStorage.setItem("revisor",$("#revisor").value)}catch(e){}};
async function api(url,corpo){const r=await fetch(url,corpo?{method:"POST",
 headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)}:{});
 const j=await r.json();if(!r.ok)throw new Error(j.erro||r.status);return j}
function marcar(trecho,nome){let t=esc(trecho);for(const p of String(nome||"").split(/\s+/)
 .filter(p=>p.length>2)){t=t.replace(new RegExp("("+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}return t}
const link=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">abrir a fonte ↗</a>`:"(sem link)";
const sigla=t=>String(t||"").trim().toUpperCase();
function lado(titulo,foto,semFoto,nome,partido,fonte){return `<div class="lado"><div class="rotulo">${titulo}</div>`
 +(foto?`<img src="${esc(foto)}" alt="foto" referrerpolicy="no-referrer" loading="lazy" onerror="this.outerHTML='<div class=semfoto>foto não abriu</div>'">`
 :`<div class="semfoto">${semFoto}</div>`)+`<div class="valor">${nome}</div><div>Partido: <b>${esc(partido)||"não informado"}</b></div>${fonte}</div>`}
function sinal(i){const a=sigla(i.partido_na_casa),b=sigla(i.partido_tse);if(!a||!b)return"";
 return `<p class="sinal">${a===b?"Mesmo partido nos dois lados.":"Partidos diferentes: a pessoa pode ter trocado de partido depois da eleição de "+esc(i.ano_tse)+"."}</p>`}
const campo=(r,v)=>`<div class="rotulo">${r}</div><div class="valor">${v}</div>`;
async function abas(){const t=await api("/api/tipos");$("#abas").innerHTML=Object.entries(t)
 .map(([k,v])=>`<button data-t="${k}" aria-pressed="${k===tipo}">${esc(v)}</button>`).join("");
 document.querySelectorAll("#abas button").forEach(b=>b.onclick=()=>{tipo=b.dataset.t;pos=0;
 document.querySelectorAll("#abas button").forEach(x=>x.setAttribute("aria-pressed",x===b));carregar()})}
async function carregar(){$("#area").innerHTML="<p>Carregando a fila (a primeira vez demora um pouco)…</p>";
 try{const j=await api("/api/fila/"+tipo);itens=j.itens;total=j.total;$("#desfazer").disabled=!j.desfazer;
 if(pos>=itens.length)pos=0;mostrar()}catch(e){$("#area").innerHTML="<p>Erro: "+esc(e.message)+"</p>"}}
function mostrar(){$("#aviso").textContent="";$("#progresso").textContent=total?
 `${total} esperando revisão · você está no ${pos+1}º da lista`:"";const i=itens[pos];
 if(!i){$("#area").innerHTML='<div class="cartao">Nada pendente nesta fila. 🎉</div>';return}
 let h='<div class="cartao">',p,b;
 if(tipo==="vinculo"){h+=campo("Onde",esc(i.casa))+'<div class="lados">'
  +lado("Na casa (hoje)",i.foto_casa,"a casa não publica foto",esc(i.na_casa),i.partido_na_casa,link(i.fonte_casa))
  +lado("No TSE (eleição de "+esc(i.ano_tse)+")",i.foto_tse,"foto do TSE ainda não carregada",esc(i.no_tse),i.partido_tse,"")
  +"</div>"+sinal(i);p="É a mesma pessoa?"}
 else if(tipo==="cpi"){h+=campo("CPI",esc(i.cpi)+" ("+esc(i.casa)+(i.data_relatorio?", encerrada em "+esc(i.data_relatorio):"")+")")
  +campo("Nome no relatório",esc(i.nome_citado)+" (página "+esc(i.pagina)+")")
  +campo("Trecho",'<div class="trecho">'+marcar(i.trecho,i.nome_citado)+"</div>")+campo("PDF",link(i.url));
  p="Quem é a pessoa citada?"}
 else{h+=campo("Pessoa",esc(i.pessoa)+(i.cargo?", "+esc(i.cargo)+" em "+esc(i.municipio):""))
  +campo("Data e ato",esc(i.data)+" · "+esc(i.tipo_ato)+(i.orgao?" · "+esc(i.orgao):""))
  +campo("Trecho",'<div class="trecho">'+marcar(i.trecho,i.pessoa)+"</div>")+campo(tipo==="dou"?"DOU":"Diário",link(i.url));
  p="O ato é desta pessoa?"}
 h+=`<div class="pergunta">${p}</div>`;
 if(tipo==="cpi"){h+=(i.candidatos||[]).map((c,n)=>`<button class="cand" data-c="${n}"><kbd>${n+1}</kbd>${esc(c.nome)} <small>${esc(c.descricao)}</small></button>`).join("")
  ||"<p>(nenhuma pessoa da base com esse nome)</p>";
  b='<button class="nao" data-d="recusado"><kbd>N</kbd>Não é pessoa da base</button>'}
 else b='<button class="sim" data-d="aceito"><kbd>A</kbd>Sim, aceitar</button><button class="nao" data-d="recusado"><kbd>R</kbd>Não, recusar</button>';
 h+=`<div class="acoes">${b}<button id="pular"><kbd>P</kbd>Pular (decidir depois)</button></div>
 <textarea id="obs" rows="2" placeholder="Observação (opcional, vai para o CSV)"></textarea></div>`;
 $("#area").innerHTML=h;document.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>decidir(x.dataset.d));
 document.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>decidir("aceito",i.candidatos[+x.dataset.c].pessoa_chave));
 $("#pular").onclick=pular}
function pular(){if(itens.length){pos=(pos+1)%itens.length;mostrar()}}
async function decidir(decisao,pessoa_chave=""){if(ocupado)return;const revisor=$("#revisor").value.trim();
 if(!revisor){$("#aviso").textContent="Preencha seu nome no alto da página.";$("#revisor").focus();return}
 ocupado=true;try{await api("/api/decidir",{tipo,indice:pos,item:itens[pos],
  decisao,revisor,pessoa_chave,observacao:$("#obs").value});await carregar()}
 catch(e){$("#aviso").textContent="Erro: "+e.message}finally{ocupado=false}}
async function desfazer(){try{const j=await api("/api/desfazer",{});if(j.tipo){tipo=j.tipo;pos=0;
 document.querySelectorAll("#abas button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===tipo))}
 await carregar()}catch(e){$("#aviso").textContent="Erro: "+e.message}}
$("#desfazer").onclick=desfazer;
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 const k=e.key.toLowerCase(),i=itens[pos];if(!i)return;
 if(k==="p")pular();else if(k==="u")desfazer();
 else if(tipo==="cpi"){if(k==="n")decidir("recusado");else if(/^[1-9]$/.test(k)&&i.candidatos[+k-1])decidir("aceito",i.candidatos[+k-1].pessoa_chave)}
 else if(k==="a")decidir("aceito");else if(k==="r")decidir("recusado")});
abas().then(carregar);
</script></body></html>
