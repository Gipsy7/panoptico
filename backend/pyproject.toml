[project]
name = "panoptico-backend"
version = "0.1.0"
description = "API e ingestão de dados do Panóptico"
license = "AGPL-3.0-only"
authors = [
    { name = "Gipsy7", email = "mikael_dev@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
