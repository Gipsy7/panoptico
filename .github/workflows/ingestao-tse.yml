name: Ingestão TSE

# Dados de eleição não mudam depois de publicados: esta carga roda à mão, uma vez por
# eleição (ou para reprocessar), e fica fora da ingestão diária.
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos de eleição, separados por espaço"
        type: string
        default: "2018 2022"

concurrency:
  group: ingestao
  cancel-in-progress: false

jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Pela variável de ambiente, e não direto no comando, para o texto digitado não virar código.
      ANOS: ${{ inputs.anos }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Migrações do banco
        run: uv run alembic upgrade head

      - name: Candidaturas (e CPF dos deputados pela API da Câmara)
        run: uv run python -m ingestion.tse.candidaturas --ano $ANOS

      - name: Bens declarados
        run: uv run python -m ingestion.tse.bens --ano $ANOS

      - name: Contas de campanha
        run: uv run python -m ingestion.tse.campanha --ano $ANOS

      # Só os brutos pequenos: as contas de campanha têm centenas de MB e ficam de fora.
      - name: Guardar dados brutos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brutos-tse-${{ github.run_id }}
          path: |
            backend/data/raw/tse_candidaturas/
            backend/data/raw/tse_bens/
          retention-days: 7
          if-no-files-found: ignore
