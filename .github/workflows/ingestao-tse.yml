name: Ingestão TSE

# Dados de eleição não mudam depois de publicados: esta carga roda à mão, uma vez por
# eleição (ou para reprocessar), e fica fora da ingestão diária.
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos de eleição, separados por espaço"
        type: string
        default: "2018 2022 2024"
      fotos:
        description: "Também baixar as fotos dos eleitos de 2022 e 2024 (cerca de 15 GB de zips; demora)"
        type: boolean
        default: false
      so_fotos:
        description: "Só as fotos (pula candidaturas, bens, contas, redes e votos)"
        type: boolean
        default: false
      fotos_anos:
        description: "Anos das fotos"
        type: string
        default: "2022 2024"
      fotos_ufs:
        description: "Só estes estados nas fotos, separados por espaço (vazio = todos)"
        type: string
        default: ""

concurrency:
  group: ingestao-tse
  cancel-in-progress: false

jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Pela variável de ambiente, e não direto no comando, para o texto digitado não virar código.
      ANOS: ${{ inputs.anos }}
      FOTOS_ANOS: ${{ inputs.fotos_anos }}
      FOTOS_UFS: ${{ inputs.fotos_ufs }}
      PYTHONUNBUFFERED: "1" # mostra o progresso das fotos no log enquanto roda
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Migrações do banco
        run: uv run alembic upgrade head

      - name: Candidaturas (e CPF dos deputados pela API da Câmara)
        if: ${{ !inputs.so_fotos }}
        run: uv run python -m ingestion.tse.candidaturas --ano $ANOS

      - name: Bens declarados
        if: ${{ !inputs.so_fotos }}
        run: uv run python -m ingestion.tse.bens --ano $ANOS

      - name: Contas de campanha
        if: ${{ !inputs.so_fotos }}
        run: uv run python -m ingestion.tse.campanha --ano $ANOS

      - name: Redes sociais informadas
        if: ${{ !inputs.so_fotos }}
        run: uv run python -m ingestion.tse.redes --ano $ANOS

      - name: Votos recebidos
        if: ${{ !inputs.so_fotos }}
        run: uv run python -m ingestion.tse.votos --ano $ANOS

      - name: Fotos dos eleitos (só quando pedido)
        if: ${{ inputs.fotos || inputs.so_fotos }}
        run: |
          if [ -n "$FOTOS_UFS" ]; then
            uv run python -m ingestion.tse.fotos --ano $FOTOS_ANOS --uf $FOTOS_UFS
          else
            uv run python -m ingestion.tse.fotos --ano $FOTOS_ANOS
          fi

      # Só os brutos pequenos: as contas de campanha têm centenas de MB e ficam de fora.
      - name: Guardar dados brutos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brutos-tse-${{ github.run_id }}
          path: |
            backend/data/raw/tse_candidaturas/
            backend/data/raw/tse_bens/
            backend/data/raw/tse_redes/
          retention-days: 7
          if-no-files-found: ignore
