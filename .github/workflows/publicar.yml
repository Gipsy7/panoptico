name: Publicar

# Publica o que está no branch `dev` sem deixar o site sem dados:
#   1. roda os testes;
#   2. aplica as migrações no banco de produção (rápido);
#   3. só se uma migração pedir (RECARREGAR_DADOS = True) ou se pedido à mão, recarrega
#      os dados federais; tabelas novas com carga própria não precisam disso;
#   4. só então avança o `main`, que é o branch que a Vercel publica.
# Assim o código novo nunca chega ao ar antes do banco estar pronto para ele.
# Regra para isso funcionar: migrações só ACRESCENTAM (tabelas, colunas opcionais),
# para o código antigo continuar funcionando com o banco novo enquanto a carga roda.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      recarregar:
        description: "Recarregar todos os dados antes de publicar, mesmo sem migração nova"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  migracoes:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      recarregar: ${{ steps.decidir.outputs.recarregar }}
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      # O Alembic trava no próprio Postgres: se uma carga estiver migrando ao mesmo tempo,
      # este passo espera e depois não tem nada a fazer.
      - name: Migrações do banco
        id: decidir
        env:
          RECARREGAR: ${{ inputs.recarregar }}
        run: |
          antes="$(uv run alembic current 2>/dev/null | tail -n 1 | awk '{print $1}')"
          uv run alembic upgrade head
          depois="$(uv run alembic current 2>/dev/null | tail -n 1 | awk '{print $1}')"
          echo "Versão do banco: '$antes' -> '$depois'"
          recarregar=false
          if [ "$RECARREGAR" = "true" ]; then
            recarregar=true
          elif [ "$antes" != "$depois" ]; then
            recarregar="$(uv run python -m ingestion.precisa_recarga "$antes" "$depois")"
          fi
          echo "Recarregar os dados federais: $recarregar"
          echo "recarregar=$recarregar" >> "$GITHUB_OUTPUT"

  recarga:
    needs: migracoes
    if: needs.migracoes.outputs.recarregar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Não roda junto com a ingestão diária: as duas escrevem nas mesmas tabelas federais.
    concurrency:
      group: ingestao-federal
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Recarregar os dados federais
        run: uv run python -m ingestion.run_all

  promover:
    needs: [migracoes, recarga]
    # Avança quando a recarga deu certo ou não foi necessária.
    if: always() && needs.migracoes.result == 'success' && (needs.recarga.result == 'success' || needs.recarga.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Só avança o main se for um "fast-forward": se alguém tiver mexido direto no main,
      # o push falha em vez de apagar o trabalho.
      - name: Avançar o main (a Vercel publica a partir dele)
        run: git push origin HEAD:main
