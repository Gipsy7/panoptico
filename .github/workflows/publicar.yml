name: Publicar

# Publica o que está no branch `dev` no RELEASE (homologação):
#   1. roda os testes;
#   2. avança o branch `release`, que a VPS publica em https://release.panoptico.social.br.
# Sem banco aqui: a API do release aplica as migrações no banco da VPS ao subir (mesmo banco da
# produção). Migração que declara RECARREGAR_DADOS = True: o atualizar.sh avisa no log, e a recarga
# é manual na VPS (sudo systemctl start panoptico-diaria). A produção (`main`) só avança pelo
# workflow manual "Promover para produção" (ou pela "Correção urgente"). Como o banco da VPS fica à
# frente do main até a promoção, as migrações só ACRESCENTAM.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Mesmo grupo da "Promover para produção" e da "Correção urgente": nunca rodam juntos.
concurrency:
  group: publicacao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  release:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Só avança o release se for um "fast-forward": se alguém tiver mexido direto nele, o push
      # falha em vez de apagar o trabalho.
      - name: Avançar o release (a VPS publica em release.panoptico.social.br)
        run: |
          git fetch --quiet origin release || true
          antes="$(git rev-parse --verify --quiet origin/release || echo nenhum)"
          git push origin HEAD:release
          {
            echo "## Release avançado"
            echo ""
            echo "- De \`${antes:0:7}\` para \`$(git rev-parse --short HEAD)\`: $(git log -1 --format=%s HEAD)"
            echo "- A VPS publica em https://release.panoptico.social.br em até 10 min."
            echo "- Produção só com o workflow **Promover para produção**."
          } >> "$GITHUB_STEP_SUMMARY"
