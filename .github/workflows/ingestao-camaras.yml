name: Câmaras e assembleias (SAPL)

# Vereadores no cargo hoje e projetos, nas câmaras que usam o SAPL (endereços do catálogo
# data/canais_oficiais.csv). Uma vez por semana, um estado por máquina: os servidores são
# das câmaras (cada uma recebe uma requisição por vez) e a composição muda pouco.
on:
  schedule:
    - cron: "0 11 * * 0" # domingo, 8h em Brasília
  workflow_dispatch:
    inputs:
      ufs:
        description: 'Estados como lista JSON (padrão: todos)'
        type: string
        default: '["AC","AL","AM","AP","BA","CE","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"]'

# Nada aqui escreve no repositório. Os jobs com `runs-on: [self-hosted, windows, brasil]` rodam no
# PC do dono, no Brasil (fontes que só respondem a IP brasileiro; ver docs/DEPLOY_GRATUITO.md,
# "Runner no Brasil"). Esses jobs só existem nos gatilhos acima (schedule e workflow_dispatch,
# nunca pull_request) e só no repositório oficial, nos branches main e dev. Se o PC estiver
# desligado, o job espera na fila; a produção segue mostrando a última carga com a data da fonte.
permissions:
  contents: read

concurrency:
  group: ingestao-camaras
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Migrações do banco
        run: uv run alembic upgrade head
      - name: Catálogo de canais oficiais (do repositório para o banco)
        run: uv run python -m ingestion.canais.catalogo

  estado:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 13 # metade dos estados por vez, para não pesar no banco
      matrix:
        uf: ${{ fromJSON(inputs.ufs || '["AC","AL","AM","AP","BA","CE","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"]') }}
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Câmaras com SAPL em ${{ matrix.uf }}
        run: uv run python -m ingestion.camaras.sapl --uf ${{ matrix.uf }}

  # Câmaras que saíram do SAPL para o portal da Cittatec: API JSON pública, uma requisição por vez.
  cittatec:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Câmaras no portal da Cittatec
        run: uv run python -m ingestion.camaras.cittatec

  # Câmaras que saíram do SAPL para o modelo de site PHP (vereadores.php) e para o portal da CR2.
  # Poucas câmaras, uma requisição por vez, com pausa.
  outros-fornecedores:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Câmaras com o site PHP de vereadores.php
        run: uv run python -m ingestion.camaras.portal_php
      - name: Câmaras no portal da CR2
        run: uv run python -m ingestion.camaras.cr2
      - name: Câmaras no Portal Modelo do Interlegis (Imbuia, Santana do Piauí)
        run: uv run python -m ingestion.camaras.portal_modelo
      - name: Câmara no site da AOS Software (Queimada Nova)
        run: uv run python -m ingestion.camaras.aos
      - name: Câmaras de Palmas, Teófilo Otoni e Frutal (sites próprios)
        run: uv run python -m ingestion.camaras.sistemas
      - name: Câmaras de Aracruz, Cachoeiro de Itapemirim, Varjão de Minas, Nortelândia, Santa Maria do Cambucá e Alvorada
        run: uv run python -m ingestion.camaras.fornecedores_alfred
      - name: Câmaras de Pimenta Bueno, Perdões e Santa Cruz (sites de fornecedor)
        run: uv run python -m ingestion.camaras.fornecedores_batgirl
      # Nucleogov / 7Focus: o robots.txt pede 5 s entre requisições (5 câmaras, ~50 páginas).
      - name: Câmaras no portal da Nucleogov / 7Focus
        run: uv run python -m ingestion.camaras.nucleogov
      # Senador Guiomard (site Wix) e Praia Grande (JSON do e-Solution): 2 requisições, pausa de 5 s.
      - name: Câmaras de Senador Guiomard e Praia Grande (sites de fornecedor)
        run: uv run python -m ingestion.camaras.fornecedores_robin

  # As assembleias legislativas que usam o SAPL (lista em ingestion/assembleias/sapl.py),
  # uma por máquina: as maiores têm milhares de votos e proposições. Roraima fica de fora:
  # o SAPL de lá responde 403 aos endereços do GitHub (do Brasil responde normalmente).
  assembleias:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        uf: ["AC", "AL", "AM", "PB", "PI", "RO", "TO"]
    defaults:
