name: Câmaras municipais (SAPL)

# Vereadores no cargo hoje e projetos, nas câmaras que usam o SAPL (endereços do catálogo
# data/canais_oficiais.csv). Uma vez por semana: os servidores são das câmaras, e a
# composição muda pouco.
on:
  schedule:
    - cron: "0 11 * * 0" # domingo, 8h em Brasília
  workflow_dispatch:
    inputs:
      limite:
        description: "Só as N primeiras câmaras (vazio = todas)"
        type: string
        default: ""

concurrency:
  group: ingestao
  cancel-in-progress: false

jobs:
  camaras:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LIMITE: ${{ inputs.limite }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Migrações do banco
        run: uv run alembic upgrade head

      - name: Câmaras com SAPL
        run: |
          if [ -n "$LIMITE" ]; then
            uv run python -m ingestion.camaras.sapl --limite "$LIMITE"
          else
            uv run python -m ingestion.camaras.sapl
          fi
