  # Assembleia de Minas Gerais: API de dados abertos própria (não usa o SAPL).
  almg:
    needs: catalogo
    if: ${{ github.repository == 'Gipsy7/panoptico' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: [self-hosted, windows, brasil]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Instalar uv (versão fixa)
        run: python -m pip install --user --quiet uv==0.12.23
      - name: Instalar dependências
        run: python -m uv sync --locked --no-dev
      - name: Assembleia de Minas Gerais (ALMG)
        run: python -m uv run python -m ingestion.assembleias.almg

