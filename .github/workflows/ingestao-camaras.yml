name: Câmaras e assembleias (SAPL)

# Vereadores no cargo hoje e projetos, nas câmaras que usam o SAPL (endereços do catálogo
# data/canais_oficiais.csv). Uma vez por semana, um estado por máquina: os servidores são
# das câmaras (cada uma recebe uma requisição por vez) e a composição muda pouco.
on:
  schedule:
    - cron: "0 11 * * 0" # domingo, 8h em Brasília
  workflow_dispatch:
    inputs:
      ufs:
        description: 'Estados como lista JSON (padrão: todos)'
        type: string
        default: '["AC","AL","AM","AP","BA","CE","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"]'

concurrency:
  group: ingestao-camaras
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Migrações do banco
        run: uv run alembic upgrade head
      - name: Catálogo de canais oficiais (do repositório para o banco)
        run: uv run python -m ingestion.canais.catalogo

  estado:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 13 # metade dos estados por vez, para não pesar no banco
      matrix:
        uf: ${{ fromJSON(inputs.ufs || '["AC","AL","AM","AP","BA","CE","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"]') }}
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Câmaras com SAPL em ${{ matrix.uf }}
        run: uv run python -m ingestion.camaras.sapl --uf ${{ matrix.uf }}

  # Câmaras que saíram do SAPL para o portal da Cittatec: API JSON pública, uma requisição por vez.
  cittatec:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Câmaras no portal da Cittatec
        run: uv run python -m ingestion.camaras.cittatec

  # As assembleias legislativas que usam o SAPL (lista em ingestion/assembleias/sapl.py),
  # uma por máquina: as maiores têm milhares de votos e proposições. Roraima fica de fora:
  # o SAPL de lá responde 403 aos endereços do GitHub (do Brasil responde normalmente).
  assembleias:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        uf: ["AC", "AL", "AM", "PB", "PI", "RO", "TO"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia de ${{ matrix.uf }} (SAPL)
        run: uv run python -m ingestion.assembleias.sapl --uf ${{ matrix.uf }}

  # Assembleia de Minas Gerais: API de dados abertos própria (não usa o SAPL).
  almg:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia de Minas Gerais (ALMG)
        run: uv run python -m ingestion.assembleias.almg

  # Assembleia de São Paulo: arquivos XML de dados abertos (não usa o SAPL).
  alesp:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia de São Paulo (ALESP)
        run: uv run python -m ingestion.assembleias.alesp

  # Assembleia de Pernambuco: API de dados abertos própria (não usa o SAPL).
  alepe:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia de Pernambuco (ALEPE)
        run: uv run python -m ingestion.assembleias.alepe

  # Câmara Legislativa do DF: API pública do processo legislativo (não usa o SAPL).
  cldf:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Câmara Legislativa do DF (CLDF)
        run: uv run python -m ingestion.assembleias.cldf

  # Assembleia de Santa Catarina: páginas públicas do e-Legis (sem API), uma por vez.
  alesc:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia de Santa Catarina (ALESC)
        run: uv run python -m ingestion.assembleias.alesc

  # Assembleia do Rio de Janeiro: páginas públicas do site (sem API), uma por vez.
  alerj:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia do Rio de Janeiro (ALERJ)
        run: uv run python -m ingestion.assembleias.alerj

  # Assembleia do Rio Grande do Sul: portais da transparência e do legislativo, uma requisição por vez.
  alrs:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
