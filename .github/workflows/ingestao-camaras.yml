      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Assembleia do Rio Grande do Sul (ALRS)
        run: uv run python -m ingestion.assembleias.alrs

  # Assembleia da Bahia: API pública de dados abertos do Processo Legislativo Eletrônico.
  alba:
    needs: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
