name: Acessibilidade

# Régua automática (axe + teclado) contra o site no ar. Só leitura, um worker, respeitando o firewall
# de 120 req/min. Não roda no push nem depende da API no CI.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC, horário de baixo tráfego
  workflow_dispatch:
    inputs:
      base_url:
        description: "Endereço do site a testar"
        required: false
        default: "https://panoptico.social.br"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://panoptico.social.br' }}
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-relatorio
          path: frontend/e2e-relatorio
          retention-days: 14
