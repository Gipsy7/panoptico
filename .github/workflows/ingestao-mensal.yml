name: Ingestão mensal

# Fontes que mudam pouco (contas anuais dos municípios no SICONFI): uma vez por mês, fora
# da ingestão diária, porque exigem milhares de consultas (uma por município).
on:
  schedule:
    - cron: "0 10 15 * *" # dia 15 de cada mês, 7h em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos das contas (vazio = os dois últimos anos fechados)"
        type: string
        default: ""

concurrency:
  group: ingestao
  cancel-in-progress: false

jobs:
  mensal:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1" # progresso no log enquanto roda
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Migrações do banco
        run: uv run alembic upgrade head

      # Um ano por vez: se um falhar (API fora do ar), o outro já ficou gravado.
      - name: Contas dos municípios (SICONFI)
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          for a in $anos; do
            uv run python -m ingestion.siconfi.contas --ano "$a"
          done
