name: Ingestão mensal

# Fontes que mudam pouco: contas anuais dos municípios (SICONFI), contas anuais dos partidos
# (TSE) e despesas por fornecedor dos Tribunais de Contas (TCE-SP; o TCE-RS não responde a conexões de fora do Brasil e roda no runner do PC no Brasil). Uma vez por mês, fora da ingestão diária, porque exigem
# milhares de consultas ou arquivos de vários GB.
#
# Primeira carga do dinheiro federal (tabelas vazias até terminar; o site mostra "sendo carregados"):
#   gh workflow run ingestao-mensal.yml -f so_dinheiro_federal=true -f anos="2019 2020 2021 2022 2023 2024 2025 2026"
# Com so_dinheiro_federal rodam só arrecadação, população (IBGE, sempre com os anos padrão do módulo),
# Tesouro e Portal (estes dois com `anos`, se informado); o resto fica de fora.
on:
  schedule:
    - cron: "0 10 15 * *" # dia 15 de cada mês, 7h em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos das contas (vazio = os dois últimos anos fechados)"
        type: string
        default: ""
      so_tce:
        description: "Só as despesas por fornecedor dos Tribunais de Contas (pula SICONFI e partidos)"
        type: boolean
        default: false
      so_partidos:
        description: "Só as contas e fundos dos partidos (pula SICONFI e Tribunais de Contas)"
        type: boolean
        default: false
      so_dinheiro_federal:
        description: "Só as fontes do dinheiro federal (arrecadação, população, Tesouro, Portal)"
        type: boolean
        default: false

# Nada aqui escreve no repositório. O job `tce-rs` roda no PC do dono, no Brasil (o TCE-RS não
# responde a conexões de fora; ver docs/DEPLOY_GRATUITO.md, "Runner no Brasil"). Só nos gatilhos
# acima (nunca pull_request) e só no repositório oficial. PC desligado: o job espera na fila e a
# produção segue com a última carga e a data da fonte.
permissions:
  contents: read

concurrency:
  group: ingestao-mensal
  cancel-in-progress: false

jobs:
  mensal:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1" # progresso no log enquanto roda
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Migrações do banco
        run: uv run alembic upgrade head

      # Um ano por vez: se um falhar (API fora do ar), o outro já ficou gravado.
      - name: Contas dos municípios (SICONFI)
        if: ${{ !inputs.so_tce && !inputs.so_partidos && !inputs.so_dinheiro_federal }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          for a in $anos; do
            uv run python -m ingestion.siconfi.contas --ano "$a"
          done

      # Contas dos 27 governos estaduais (SICONFI/DCA), mesmos anos dos municípios.
      - name: Contas dos estados (SICONFI)
        if: ${{ !inputs.so_tce && !inputs.so_partidos && !inputs.so_dinheiro_federal }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          uv run python -m ingestion.siconfi.contas_estados --ano $anos

      # Agenda de autoridades federais (e-Agendas, CGU): zip aberto de ~205 MB, mensal; só grava
      # agentes ligados a pessoas que acompanhamos.
      - name: Agenda de autoridades (e-Agendas)
        if: ${{ !inputs.so_tce && !inputs.so_partidos && !inputs.so_dinheiro_federal }}
        run: uv run python -m ingestion.executivo.eagendas

      # Dinheiro federal por estado: arrecadação (CSV de ~2,4 MB, só baixa de novo se mudou) e
      # população do IBGE (SIDRA). Leves; rodam sempre.
      - name: Arrecadação federal por estado (Receita Federal)
        if: ${{ !inputs.so_tce && !inputs.so_partidos }}
        run: uv run python -m ingestion.receita.arrecadacao_uf

      - name: População (IBGE)
        if: ${{ !inputs.so_tce && !inputs.so_partidos }}
        run: uv run python -m ingestion.ibge.populacao

      # As transferências obrigatórias do Tesouro rodam no job `tesouro`, no runner do Brasil.

      # Fundeb (complementação da União), royalties e transferências legais, voluntárias e
      # específicas, do Portal da Transparência: um zip por mês, um download por vez com pausa de
      # 20 s. Sem `anos`: os 3 últimos meses publicados (o Portal os corrige). Com `anos`: os meses
      # publicados desses anos que ainda não foram carregados (carga inicial: "2019 ... 2026", ~1 h).
      # O WAF do Portal responde 403/405 a quem pede demais: a carga PARA no primeiro bloqueio, grava
      # o erro em fonte_ingestao e não tenta de novo; o resto do mês continua (continue-on-error) e
      # a próxima execução retoma de onde parou.
      - name: Transferências da União (Portal da Transparência)
        if: ${{ !inputs.so_tce && !inputs.so_partidos }}
        continue-on-error: true
        run: |
          if [ -n "$ANOS" ]; then
            uv run python -m ingestion.portal.transferencias --ano $ANOS
          else
            uv run python -m ingestion.portal.transferencias
          fi

      # Prestação de contas anual dos partidos (zip de ~60 MB por exercício, lido em fluxo; ~11 MB
      # no banco por ano). O exercício atual costuma dar 404 (ainda não publicado) e é pulado.
      - name: Contas dos partidos (TSE)
        if: ${{ !inputs.so_tce && !inputs.so_dinheiro_federal }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 1)) $ano"
          fi
          for a in $anos; do
            uv run python -m ingestion.tse.contas_partidarias --ano "$a"
          done

      # Distribuição do FEFC e do Fundo Partidário por gênero e cor ou raça (eleição de 2024).
      - name: Fundos por gênero e raça (TSE)
        if: ${{ !inputs.so_tce && !inputs.so_dinheiro_federal }}
        run: uv run python -m ingestion.tse.fefc_fp --ano 2024

      # Arquivos de 2 GB compactados (15 GB ou mais descompactados), lidos em fluxo.
      - name: Despesas por fornecedor (TCE-SP)
        if: ${{ !inputs.so_partidos && !inputs.so_dinheiro_federal }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          for a in $anos; do
            uv run python -m ingestion.tce.sp --ano "$a"
          done

  # Repasses obrigatórios da União a estados e cidades (FPE, FPM, IPI-Exp, CIDE, IOF-Ouro, ITR,
  # LC 176): CKAN do Tesouro Transparente, ~140 MB de CSV reduzidos a um recorte de ~6 MB. O
  # tesourotransparente.gov.br derruba a conexão vinda do GitHub (EUA; "Connection reset by peer"
  # em 20/10/2026) e responde do Brasil: roda no runner do PC no Brasil. Sem `anos`: o ano anterior
  # e o atual. Carga inicial: anos = "2019 2020 ...".
  tesouro:
    needs: mensal
    if: ${{ !cancelled() && !inputs.so_tce && !inputs.so_partidos && github.repository == 'Gipsy7/panoptico' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: [self-hosted, windows, brasil]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Bash do Git no PATH
        shell: cmd
        run: echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Transferências obrigatórias da União (Tesouro)
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 1)) $ano"
          fi
          uv run python -m ingestion.tesouro.transferencias --ano $anos

  # Despesas por fornecedor do TCE-RS: dados.tce.rs.gov.br só responde a IP do Brasil.
  tce-rs:
    needs: mensal
    if: ${{ !cancelled() && !inputs.so_partidos && !inputs.so_dinheiro_federal && github.repository == 'Gipsy7/panoptico' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: [self-hosted, windows, brasil]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      # O serviço do runner (usuário próprio) não enxerga o Python nem o Bash do dono: Git\bin
      # entra no PATH e o uv (ação oficial) baixa um Python gerenciado no primeiro `uv sync`.
      - name: Bash do Git no PATH
        # cmd, e não powershell: o usuário do serviço tem a execução de scripts do PowerShell
        # desativada (política padrão do Windows), e não vale afrouxar isso só para este passo.
        shell: cmd
        run: echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Instalar dependências
        run: uv sync --locked --no-dev
      - name: Despesas por fornecedor (TCE-RS)
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          for a in $anos; do
            uv run python -m ingestion.tce.rs --ano "$a"
          done
