name: Ingestão mensal

# Fontes que mudam pouco: contas anuais dos municípios (SICONFI), contas anuais dos partidos
# (TSE) e despesas por fornecedor dos Tribunais de Contas (TCE-SP; o TCE-RS não responde a conexões de fora do Brasil e roda no acervo local). Uma vez por mês, fora da ingestão diária, porque exigem
# milhares de consultas ou arquivos de vários GB.
on:
  schedule:
    - cron: "0 10 15 * *" # dia 15 de cada mês, 7h em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos das contas (vazio = os dois últimos anos fechados)"
        type: string
        default: ""
      so_tce:
        description: "Só as despesas por fornecedor dos Tribunais de Contas (pula SICONFI e partidos)"
        type: boolean
        default: false
      so_partidos:
        description: "Só as contas e fundos dos partidos (pula SICONFI e Tribunais de Contas)"
        type: boolean
        default: false

concurrency:
  group: ingestao-mensal
  cancel-in-progress: false

jobs:
  mensal:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1" # progresso no log enquanto roda
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Instalar dependências
        run: uv sync --locked --no-dev

      - name: Migrações do banco
        run: uv run alembic upgrade head

      # Um ano por vez: se um falhar (API fora do ar), o outro já ficou gravado.
      - name: Contas dos municípios (SICONFI)
        if: ${{ !inputs.so_tce && !inputs.so_partidos }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          for a in $anos; do
            uv run python -m ingestion.siconfi.contas --ano "$a"
          done

      # Prestação de contas anual dos partidos (zip de ~60 MB por exercício, lido em fluxo; ~11 MB
      # no banco por ano). O exercício atual costuma dar 404 (ainda não publicado) e é pulado.
      - name: Contas dos partidos (TSE)
        if: ${{ !inputs.so_tce }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 1)) $ano"
          fi
          for a in $anos; do
            uv run python -m ingestion.tse.contas_partidarias --ano "$a"
          done

      # Distribuição do FEFC e do Fundo Partidário por gênero e cor ou raça (eleição de 2024).
      - name: Fundos por gênero e raça (TSE)
        if: ${{ !inputs.so_tce }}
        run: uv run python -m ingestion.tse.fefc_fp --ano 2024

      # Arquivos de 2 GB compactados (15 GB ou mais descompactados), lidos em fluxo.
      - name: Despesas por fornecedor (TCE-SP)
        if: ${{ !inputs.so_partidos }}
        run: |
          anos="$ANOS"
          if [ -z "$anos" ]; then
            ano=$(date +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          for a in $anos; do
            uv run python -m ingestion.tce.sp --ano "$a"
          done
