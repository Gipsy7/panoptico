name: Fumaça no release

# A cada push no dev, espera o Publicar e a VPS e confere no release os caminhos que definem o
# produto (frontend/e2e/fluxos.spec.ts): cidade → perfil, projeto → votação, comparação e 404.
# Só leitura. Não bloqueia nada: se falhar, o run fica vermelho e o GitHub avisa por e-mail.
#
# Por que no push e não "depois do Publicar": o gatilho workflow_run só vale para workflow que já
# está no main, e o release é avançado com o token do Actions, que não dispara outros workflows.
# Fica fora do Publicar para não segurar o grupo `publicacao` (uma correção urgente esperaria).
# Se o Publicar falhar, o release não muda e este teste confere a versão anterior, sem dano.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Endereço do site a testar"
        required: false
        default: "https://release.panoptico.social.br"

permissions:
  contents: read

concurrency:
  group: fumaca-release
  cancel-in-progress: true

jobs:
  fumaca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Publicar (uns 2 min) + a VPS, que busca o release a cada 10 min e reconstrói as imagens.
      - name: Esperar o Publicar e a VPS
        if: github.event_name == 'push'
        run: sleep 1080
      - name: Rodar os fluxos
        run: npx playwright test fluxos --project=celular-360 --project=desktop-1280
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://release.panoptico.social.br' }}
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-relatorio
          path: frontend/e2e-relatorio
          retention-days: 14
