name: Fumaça no release

# Depois de cada Publicar que passou, confere no release os caminhos que definem o produto
# (frontend/e2e/fluxos.spec.ts): cidade → perfil, projeto → votação, comparação e 404. Só leitura.
# Não bloqueia nada: se falhar, o run fica vermelho e o GitHub avisa por e-mail.
on:
  workflow_run:
    workflows: ["Publicar"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Endereço do site a testar"
        required: false
        default: "https://release.panoptico.social.br"

permissions:
  contents: read

concurrency:
  group: fumaca-release
  cancel-in-progress: true

jobs:
  fumaca:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A VPS busca o branch release a cada 10 minutos e ainda reconstrói as imagens.
      - name: Esperar a VPS publicar o release
        if: github.event_name == 'workflow_run'
        run: sleep 780
      - name: Rodar os fluxos
        run: npx playwright test fluxos --project=celular-360 --project=desktop-1280
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://release.panoptico.social.br' }}
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-relatorio
          path: frontend/e2e-relatorio
          retention-days: 14
