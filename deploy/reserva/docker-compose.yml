services:
  api:
    build: ../../backend
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}
      --proxy-headers --forwarded-allow-ips='*'
    env_file: .env
    environment:
      SERVERLESS: "1"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/saude', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped
