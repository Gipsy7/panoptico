resumo = """A Comissão Parlamentar de Inquérito da Pandemia, do Senado Federal, foi instalada em 27/04/2021 para apurar ações e omissões do Governo Federal no enfrentamento da Covid-19 e possíveis irregularidades em contratos e no uso de recursos federais. O Relatório Final foi aprovado e publicado na página oficial da comissão em 26/10/2021. O relatório propõe o indiciamento de dezenas de pessoas. Pedido de indiciamento de CPI é proposta da comissão: não é acusação formal nem condenação, e cabe ao Ministério Público decidir se denuncia. O desfecho dos encaminhamentos ao Ministério Público Federal e ao Supremo Tribunal Federal ainda não foi confirmado em documento oficial."""
