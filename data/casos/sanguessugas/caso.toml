resumo = """A Comissão Parlamentar Mista de Inquérito "das Ambulâncias" foi criada em 2006 \
(Requerimento nº 77/2006-CN) para investigar a compra de ambulâncias e equipamentos de saúde \
com recursos de emendas parlamentares, apurada na Operação Sanguessuga da Polícia Federal. O \
Relatório Parcial nº 1 (10/08/2006) recomendou o envio dos elementos de prova às Mesas da \
Câmara e do Senado, para exame no Conselho de Ética, quanto a 72 parlamentares, e o \
arquivamento das imputações contra outros 18, por falta de provas para recomendar \
procedimento disciplinar. O Relatório Final nº 6/2006-CN foi aprovado em 06/12/2006. Recomendação \
da CPMI não é condenação: a responsabilização cabe ao Conselho de Ética, ao Ministério \
Público e ao Judiciário."""
